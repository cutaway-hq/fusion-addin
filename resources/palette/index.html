<!--
  Cutaway Palette — the branded launch-pad UI for the Fusion add-in.

  Single self-contained HTML file. Loaded by `src/ui.py` via the Fusion
  Palettes API (palettes.add) and shown when the user clicks the Cutaway
  toolbar button. Talks to Python by posting actions through
  `adsk.fusionSendData(action, jsonStr)` — see the matching HTMLEventHandler
  on the Python side for the routing.

  Design intent:
   - Match Fusion's dark theme so the palette doesn't feel grafted on.
   - One primary action (Import sections) front and centre, large enough
     to read as the obvious thing to click.
   - Space at the bottom reserved for the future "Publish to Cutaway"
     button — wire that up by adding another data-action button + a Python
     handler when the marketplace lands.

  This file is bundled with the add-in zip — see install scripts and
  release.yml. No build step, no external assets. Keep it that way unless
  there's a really good reason not to.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cutaway</title>
<style>
  /* Color tokens mirror the web app (slice-app/src/styles/app.css). Keep in
     sync so the add-in feels like the same product. */
  :root {
    --bg-primary: #0f0f1a;
    --bg-panel: rgba(15, 15, 26, 0.85);
    --bg-hover: rgba(255, 255, 255, 0.06);
    --bg-active: rgba(56, 189, 248, 0.15);
    --border: rgba(255, 255, 255, 0.08);
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #38bdf8;
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 8px;
    gap: 8px;
  }

  /* Brand strip mirrors the web app's panel header: uppercase label, count
     badge style, subtle bottom rule. */
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px 6px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .brand-logo {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0;
  }
  .brand-name {
    letter-spacing: 0.05em;
  }
  .brand-tagline {
    margin-left: auto;
    font-size: 10px;
    background: var(--bg-hover);
    color: var(--text-primary);
    padding: 1px 6px;
    border-radius: 8px;
    letter-spacing: 0;
    text-transform: none;
    font-weight: 400;
  }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-secondary);
    padding: 4px 8px 0;
  }

  /* Action items mirror `.section-item` in the web app: transparent until
     hovered, then a subtle white wash. Selected state uses the accent
     tint exactly like the sections panel. */
  button.action {
    appearance: none;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.12s ease, color 0.12s ease;
  }
  button.action:hover:not(:disabled) {
    background: var(--bg-hover);
  }
  button.action:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Primary = the workflow's main action. Same restraint as the web app:
     a faint accent-tinted background, accent-colored icon, neutral text.
     Reads as inviting without dominating the panel. */
  button.action.primary {
    background: var(--bg-active);
  }
  button.action.primary:hover:not(:disabled) {
    background: rgba(56, 189, 248, 0.22);
  }
  button.action.primary .action-icon {
    color: var(--accent);
  }

  .action-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
  }
  .action-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }
  .action-title {
    font-size: 12px;
    color: var(--text-primary);
  }
  .action-desc {
    font-size: 10.5px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .footer {
    margin-top: auto;
    padding: 8px;
    font-size: 10px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
  }
  .footer a {
    color: var(--text-secondary);
    text-decoration: none;
  }
  .footer a:hover {
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-logo">C</div>
    <div class="brand-name">Cutaway</div>
    <div class="brand-tagline">Section import</div>
  </div>

  <div class="section-label">Workflows</div>

  <button class="action primary" data-action="import">
    <div class="action-icon">
      <!-- inline SVG, no external request -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </div>
    <div class="action-text">
      <span class="action-title">Import sections</span>
      <span class="action-desc">Pick a Cutaway zip — each section becomes a sketch.</span>
    </div>
  </button>

  <!--
    Placeholder slot for the future "Publish to Cutaway" button:

      <button class="action" data-action="publish">
        <div class="action-icon">...</div>
        <div class="action-text">
          <span class="action-title">Publish to Cutaway</span>
          <span class="action-desc">Export this design and list it on the marketplace.</span>
        </div>
      </button>

    Wiring on the Python side: handle the `publish` action in the
    HTMLEventHandler. See CLAUDE.md for the marketplace design notes.
  -->

  <div class="footer">
    <span>cutawayhq.com</span>
    <a href="#" data-action="open-help">Help</a>
  </div>
</div>

<script>
  // Single delegated click handler routes every [data-action] button to the
  // Python side. Keeping it in one place means adding a new feature later
  // is "drop another button with data-action=..." — no JS plumbing per
  // button.
  document.addEventListener('click', function (e) {
    const target = e.target.closest('[data-action]')
    if (!target) return
    const action = target.dataset.action
    if (!action) return
    e.preventDefault()
    // adsk.fusionSendData is injected into the page by Fusion when it hosts
    // the HTML in a Palette. Outside Fusion (e.g. opening this file in a
    // browser for layout work) the call is a no-op.
    if (typeof adsk !== 'undefined' && adsk.fusionSendData) {
      adsk.fusionSendData(action, JSON.stringify({}))
    } else {
      console.log('[cutaway palette] (outside fusion) action:', action)
    }
  })
</script>
</body>
</html>
